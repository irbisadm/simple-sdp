name: Release

# A pushed v* tag gets a GitHub Release with the WebAssembly module and the release notes
# of CHANGELOG.md, and is published to npm with trusted publishing (OIDC, no token; npm
# adds provenance). The trust is registered on npm for this repository and this file:
#   npm trust github @irbisadm/simple-sdp --file release.yml --repo irbisadm/simple-sdp --allow-publish
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ (trusted publishing)
        run: npm install -g npm@11
      - run: yarn install --frozen-lockfile
      - name: The tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Build the wasm module
        run: yarn asbuild
      - name: The committed platform copies are this build
        run: git diff --exit-code -- platforms
      - name: Release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f = 1; next} /^## \[/ {f = 0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # skipped when the release exists, so that a failed npm step can be re-run
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
            exit 0
          fi
          # a pre-release (v1.3.0-rc.1) must not become the latest release
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          cd wasm/build
          sha256sum simple-sdp.wasm > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" $prerelease --title "$GITHUB_REF_NAME" --notes-file ../../notes.md \
            simple-sdp.wasm SHA256SUMS
      - name: Publish to npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "@irbisadm/simple-sdp@$version" version >/dev/null 2>&1; then
            echo "@irbisadm/simple-sdp@$version is already on npm"
            exit 0
          fi
          # a pre-release (1.3.0-rc.1) must not become `latest`
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --access public --tag "$tag"
